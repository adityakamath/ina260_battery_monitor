name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build + test (${{ matrix.ros_distro }})
    # Runs in the ROS image: Lyrical targets Ubuntu 26.04, which the 24.04 runner cannot install directly.
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted, jazzy, lyrical]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.ros_distro }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions \
            python3-smbus2 python3-yaml python3-pytest \
            ros-${{ matrix.ros_distro }}-diagnostic-msgs ros-${{ matrix.ros_distro }}-launch-ros \
            ros-${{ matrix.ros_distro }}-sensor-msgs ros-${{ matrix.ros_distro }}-std-srvs

      - name: Create workspace
        run: |
          mkdir -p ~/ros2_ws/src
          cp -r "$GITHUB_WORKSPACE" ~/ros2_ws/src/ina260_battery_monitor

      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/ros2_ws
          colcon build --packages-select ina260_battery_monitor

      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source ~/ros2_ws/install/setup.bash
          cd ~/ros2_ws
          colcon test --packages-select ina260_battery_monitor --event-handlers console_direct+
          colcon test-result --verbose

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.0
